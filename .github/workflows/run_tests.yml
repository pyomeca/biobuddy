name: Run the tests

on: [pull_request]

env:
  EXAMPLES_FOLDER: examples

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04]  # windows-latest, macos-latest
        include:
          - os: ubuntu-latest
            label: linux-64
            prefix: /usr/share/miniconda3/envs/biobuddy
          # - os: macos-latest  # Because of biorbd fixed version
          #   label: osx-arm64
          #   prefix: /Users/runner/miniconda3/envs/biobuddy
          # - os: windows-latest
          #   label: win-64
          #   prefix: C:\Miniconda3\envs\biobuddy
          #
          # Removed Windows due to the following error:
          # ________________ ERROR collecting tests/test_osim_to_biomod.py ________________
          #ImportError while importing test module 'D:\a\biobuddy\biobuddy\tests\test_osim_to_biomod.py'.
          #Hint: make sure your test modules/packages have valid Python names.
          #Traceback:
          #C:\Users\runneradmin\miniconda3\envs\test\Lib\importlib\__init__.py:126: in import_module
          #    return _bootstrap._gcd_import(name[level:], package, level)
          #tests\test_osim_to_biomod.py:7: in <module>
          #    import opensim as osim
          #C:\Users\runneradmin\miniconda3\envs\test\Lib\opensim\__init__.py:19: in <module>
          #    from .common import *
          #C:\Users\runneradmin\miniconda3\envs\test\Lib\opensim\common.py:10: in <module>
          #    from . import _common
          #E   ImportError: DLL load failed while importing _common: The specified procedure could not be found.
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code with submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          # Building OpenSim from source (Simbody + the full OpenSim/Moco
          # tree) plus conda/biorbd needs more disk than the ~14GB free by
          # default on GitHub runners. Remove large preinstalled toolchains
          # we don't use to make room, otherwise the build (or even the
          # earlier `git clone` of opensim-core) can silently run out of
          # space and fail with an unrelated-looking error.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - name: Set up Python
        run: |
          conda install -cconda-forge python=3.11.11 pip

      - name: Install system dependencies for building OpenSim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libblas-dev liblapack-dev \
            freeglut3-dev libxi-dev libxmu-dev \
            pkg-config
          pip install swig

      - name: Install dependencies
        run: | 
          pip install . && pip uninstall -y biobuddy
          pip install scipy==1.17.0 numpy==2.4.1 lxml ezc3d matplotlib plotly
          conda install biorbd graphviz -cconda-forge

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov codecov
          conda install -c conda-forge deepdiff pinocchio pandas

      - name: Build and install OpenSim from source
        run: |
          # Cap parallel compile jobs to the runner's core count: the script
          # defaults to 24 jobs, which OOM-kills the compiler on standard
          # (4-core) GitHub runners partway through the build.
          export OPENSIM_BUILD_JOBS=$(nproc)
          bash .github/workflows/install_opensim.sh "$CONDA_PREFIX"

          OPENSIM_INSTALL="$(pwd)/opensim/opensim_core_install"
          OPENSIM_PY_INIT=$(find "$OPENSIM_INSTALL" -path "*/opensim/__init__.py" | head -n1)
          OPENSIM_PY_PKG_PARENT=$(dirname "$(dirname "$OPENSIM_PY_INIT")")
          LIB_DIRS=$(find "$OPENSIM_INSTALL" -name "*.so*" -exec dirname {} \; | sort -u | paste -sd:)

          echo "PYTHONPATH=$OPENSIM_PY_PKG_PARENT:$PYTHONPATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LIB_DIRS:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: List conda packages
        run: conda list

      - name: Run tests with code coverage
        run: pytest -v --color=yes --cov-report=xml --cov=biobuddy tests

      - name: Send Codecov report
        id: archive
        uses: codecov/codecov-action@v5
        with:
          path: .coverage
          if-no-files-found: error
          fail_ci_if_error: true
          verbose: true
        if: matrix.os == 'ubuntu-latest'

      - name: Generate XML report
        run: |
          coverage xml
          coverage report -m

      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Test installed version of python
        run: | 
          BASE_FOLDER=`pwd`
          pip install .
          cd
          python -c "import biobuddy"
          cd $BASE_FOLDER
